<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>FlowShop 3机调度智能体(列出全部120种)</title>
<style>
body{font-family:system-ui; padding:20px;}
table{border-collapse:collapse; margin:10px 0;}
td,th{border:1px solid #999; padding:6px 10px;}
.opt{background:#90ee90; font-weight:bold;}
#listAll{max-height:450px; overflow:auto; border:1px solid #ccc; padding:10px;}
</style>
</head>
<body>
<h2>Flow-shop三机调度求解（5工件，枚举全部120组合）</h2>
<div>
<h4>输入加工时间：</h4>
<table>
<tr><th>工件</th><th>机器A</th><th>机器B</th><th>机器C</th></tr>
<tr>
<td>1</td>
<td><input id="t1a" value="4" size="3"></td>
<td><input id="t1b" value="5" size="3"></td>
<td><input id="t1c" value="8" size="3"></td>
</tr>
<tr>
<td>2</td>
<td><input id="t2a" value="9" size="3"></td>
<td><input id="t2b" value="6" size="3"></td>
<td><input id="t2c" value="10" size="3"></td>
</tr>
<tr>
<td>3</td>
<td><input id="t3a" value="8" size="3"></td>
<td><input id="t3b" value="2" size="3"></td>
<td><input id="t3c" value="6" size="3"></td>
</tr>
<tr>
<td>4</td>
<td><input id="t4a" value="6" size="3"></td>
<td><input id="t4b" value="3" size="3"></td>
<td><input id="t4c" value="7" size="3"></td>
</tr>
<tr>
<td>5</td>
<td><input id="t5a" value="5" size="3"></td>
<td><input id="t5b" value="4" size="3"></td>
<td><input id="t5c" value="11" size="3"></td>
</tr>
</table>
<button onclick="calc()">计算（Johnson+全部120枚举）</button>
<div id="tip" style="color:red; margin:10px 0;"></div>
</div>

<div>
<h3>Johnson法则结果</h3>
<div id="resJohnson"></div>
</div>

<div>
<h3>✅全局最优（穷举）</h3>
<div id="resBrute"></div>
</div>

<div>
<h3>全部120种排列结果（顺序 | makespan）</h3>
<div id="listAll"></div>
</div>

<script>
// 获取输入数据
function getJobs(){
    return [
        {A:Number(document.getElementById('t1a').value), B:Number(document.getElementById('t1b').value), C:Number(document.getElementById('t1c').value), id:1},
        {A:Number(document.getElementById('t2a').value), B:Number(document.getElementById('t2b').value), C:Number(document.getElementById('t2c').value), id:2},
        {A:Number(document.getElementById('t3a').value), B:Number(document.getElementById('t3b').value), C:Number(document.getElementById('t3c').value), id:3},
        {A:Number(document.getElementById('t4a').value), B:Number(document.getElementById('t4b').value), C:Number(document.getElementById('t4c').value), id:4},
        {A:Number(document.getElementById('t5a').value), B:Number(document.getElementById('t5b').value), C:Number(document.getElementById('t5c').value), id:5},
    ]
}

// 计算给定序列的makespan
function calcMakespan(jobSeq){
    let ma=0,mb=0,mc=0;
    for(let j of jobSeq){
        ma = Math.max(ma, mb) + j.A;
        mb = Math.max(mb, mc) + j.B;
        mc = Math.max(mc, 0) + j.C;
    }
    return mc;
}

// 全排列生成
function permute(arr){
    let res=[];
    function dfs(rest, path){
        if(rest.length===0){
            res.push([...path]);
            return;
        }
        for(let i=0;i<rest.length;i++){
            let newRest = rest.filter((_,idx)=>idx!==i);
            dfs(newRest, [...path, rest[i]]);
        }
    }
    dfs(arr,[]);
    return res;
}

// Johnson三机
function johnson3(jobs){
    let minA = Math.min(...jobs.map(x=>x.A));
    let maxB = Math.max(...jobs.map(x=>x.B));
    let minC = Math.min(...jobs.map(x=>x.C));
    let tipDom = document.getElementById('tip');
    if(minC >= maxB){
        tipDom.innerText = "✅满足三机Johnson充分条件 min(Ci) ≥ max(Bi)，Johnson解为全局最优";
        tipDom.style.color='green';
    }else{
        tipDom.innerText = "⚠️不满足三机Johnson充分条件，Johnson仅为可行解，不能保证全局最优！";
        tipDom.style.color='red';
    }
    //虚拟两机
    let vJobs = jobs.map(j=>({
        id:j.id,
        a:j.A + j.B,
        b:j.B + j.C
    }));
    let left=[],right=[];
    for(let x of vJobs){
        if(x.a < x.b) left.push(x);
        else right.push(x);
    }
    left.sort((p,q)=>p.a - q.a);
    right.sort((p,q)=>q.b - p.b);
    let seqId = [...left,...right].map(x=>x.id);
    let seq = seqId.map(id=>jobs.find(j=>j.id===id));
    return {seq, seqId, mk:calcMakespan(seq)};
}

function calc(){
    const jobs = getJobs();
    //Johnson
    let jh = johnson3(jobs);
    document.getElementById('resJohnson').innerText=`加工顺序：${jh.seqId.join(' → ')}，Makespan=${jh.mk}`;

    //全部120枚举
    let allPerm = permute(jobs);
    let listHtml = "";
    let minMk=Infinity;
    let bestSeqId=null;
    for(let p of allPerm){
        let mk = calcMakespan(p);
        let ids = p.map(x=>x.id).join(',');
        if(mk < minMk){
            minMk = mk;
            bestSeqId = ids;
        }
    }
    //二次遍历渲染，高亮最优
    for(let p of allPerm){
        let mk = calcMakespan(p);
        let ids = p.map(x=>x.id).join(',');
        let cls = (mk===minMk) ? 'opt' : '';
        listHtml += `<div class="${cls}">顺序：${ids} ，makespan = ${mk}</div>`;
    }
    document.getElementById('listAll').innerHTML = listHtml;
    document.getElementById('resBrute').innerText=`最优顺序：${bestSeqId}，最小Makespan=${minMk}`;
}
</script>
</body>
</html>
